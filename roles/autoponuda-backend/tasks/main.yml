---
- name: Create shared Docker network
  community.docker.docker_network:
    name: "{{ shared_network }}"
    state: present

- name: Log in to GHCR
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"

- name: Create backend directory
  ansible.builtin.file:
    path: "{{ backend_dir }}"
    state: directory
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ backend_dir }}/docker-compose.yml"
    mode: "0640"
  notify: Restart backend stack

- name: Pull image and start backend stack
  community.docker.docker_compose_v2:
    project_src: "{{ backend_dir }}"
    state: present
    pull: always
